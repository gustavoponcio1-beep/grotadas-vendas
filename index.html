'use strict';const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100,num=v=>Number(String(v??'').replace(',','.'))||0,uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleString('pt-BR'),now=()=>new Date().toISOString();let db,model,screen='inicio',session='admin';
const initial=()=>({version:8,products:[],clients:[],loads:[],sales:[],pending:[],settlements:[],users:[{id:'admin',name:'Administrador',role:'admin'},{id:'marcos',name:'Marcos',role:'vendedor'},{id:'igor',name:'Igor',role:'vendedor'},{id:'conferente',name:'Conferente',role:'conferente'}]});
function openDb(){return new Promise((res,rej)=>{const req=indexedDB.open('grotadas-v8-local',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}function loadDb(){return new Promise((res,rej)=>{let t=db.transaction('state','readonly').objectStore('state').get('main');t.onsuccess=()=>res(t.result||initial());t.onerror=()=>rej(t.error)})}function persist(){return new Promise((res,rej)=>{const t=db.transaction('state','readwrite');t.objectStore('state').put(model,'main');t.oncomplete=res;t.onerror=()=>rej(t.error)})}function queued(type,id){model.pending.push({id:uid(),type,recordId:id,at:now()})}async function change(fn){try{fn();await persist();render()}catch(e){alert('Erro: '+e.message)}}function requireRole(...roles){if(!roles.includes(role()))throw Error('Acesso não autorizado')}function role(){return model.users.find(x=>x.id===session)?.role||'vendedor'}function product(id){return model.products.find(x=>x.id===id)}function activeLoad(id){return model.loads.find(x=>x.id===id)}function itemsSold(loadId,pid){return model.sales.filter(x=>x.loadId===loadId).flatMap(x=>x.items).filter(x=>x.pid===pid).reduce((a,x)=>({qty:a.qty+x.qty,pieces:a.pieces+x.pieces}),{qty:0,pieces:0})}function available(load,pid){let it=load.items.find(x=>x.pid===pid),sold=itemsSold(load.id,pid);return{qty:round((it?.qty||0)-sold.qty),pieces:(it?.pieces||0)-sold.pieces}}function inStock(load,pid,qty,pieces){const a=available(load,pid);return qty<=a.qty+.000001&&pieces<=a.pieces}
const routes=['inicio','venda','cargas','clientes','produtos','fechar','dados'];const labels=['Painel','Nova venda','Cargas','Clientes','Produtos','Conferir','Dados'];const allowed=()=>role()==='admin'?routes:role()==='conferente'?['inicio','cargas','fechar','dados']:['inicio','venda','clientes','dados'];function navigate(s){if(!allowed().includes(s))return;screen=s;render()}function stateNotice(){const n=model.pending.length;$('#status').className=n?'warn':'ok';$('#status').innerHTML=n?`📱 ${n} operação(ões) salva(s) neste aparelho; <b>não sincronizada(s)</b>.`:'📱 Dados locais disponíveis. Sem envio automático à planilha V7.'}function render(){if(!allowed().includes(screen))screen='inicio';stateNotice();$('#nav').innerHTML=allowed().map(x=>`<button class="${screen===x?'gold':'secondary'}" onclick="navigate('${x}')">${labels[routes.indexOf(x)]}</button>`).join('');let html={inicio:home,venda:saleScreen,cargas:loadsScreen,clientes:clientsScreen,produtos:productsScreen,fechar:closeScreen,dados:dataScreen}[screen]();$('#app').innerHTML=html;}
function home(){const sales=model.sales,tot=sales.reduce((v,x)=>v+x.total,0);return `<section class="card"><h2>Visão local</h2><label>Perfil para simulação neste aparelho</label><select onchange="session=this.value;screen='inicio';render()">${model.users.map(u=>`<option value="${u.id}" ${u.id===session?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('')}</select><p class="warn"><b>Piloto sem autenticação real.</b> Trocar perfil aqui é apenas para testes. Não compartilhe este piloto como sistema seguro de funcionários.</p><div class="grid"><div class="card"><div class="muted">Vendas locais</div><div class="amount">${money(tot)}</div></div><div class="card"><div class="muted">Vendas registradas</div><div class="amount">${sales.length}</div></div><div class="card"><div class="muted">Cargas</div><div class="amount">${model.loads.length}</div></div><div class="card"><div class="muted">Pendências de exportação</div><div class="amount">${model.pending.length}</div></div></div></section><section class="card"><h2>Últimas vendas</h2>${sales.slice(-12).reverse().map(s=>`<div class="item"><b>${money(s.total)}</b> · ${esc(model.clients.find(c=>c.id===s.clientId)?.name||'Cliente')}<div class="muted">${new Date(s.at).toLocaleString('pt-BR')} · ${esc(s.seller)} · ${s.items.length} item(ns)</div></div>`).join('')||'<p class="muted">Nenhuma venda local ainda.</p>'}</section>`}
function productsScreen(){requireRole('admin');return `<section class="card"><h2>Cadastrar produto</h2><form onsubmit="addProduct(event)"><label>Nome</label><input name="name" required><div class="grid"><div><label>Unidade de venda</label><select name="unit"><option value="kg">Queijo (kg + peças)</option><option value="un">Unidade</option></select></div><div><label>Varejo (R$/kg ou un)</label><input name="retail" type="number" min="0" step="0.01" required></div><div><label>Atacado (R$/kg ou un)</label><input name="wholesale" type="number" min="0" step="0.01" required></div><div><label>Mínimo atacado (peças/un)</label><input name="minPieces" type="number" min="1" step="1" value="5" required></div><div><label>Desconto máximo (%)</label><input name="maxDiscount" type="number" min="0" max="100" step="0.1" value="0"></div></div><button class="wide">Salvar produto</button></form></section><section class="card"><h2>Produtos locais (${model.products.length})</h2>${model.products.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="pill">${p.unit}</span><div class="muted">Varejo ${money(p.retail)} · atacado ${money(p.wholesale)} · mín. ${p.minPieces} ${p.unit==='kg'?'peças':'un'} · desc. máx. ${p.maxDiscount}%</div><button class="secondary" onclick="editProduct('${p.id}')">Editar</button></div>`).join('')||'<p>Importe seu cadastro V7 em Dados ou registre um produto.</p>'}</section>`}
async function addProduct(e){e.preventDefault();let f=new FormData(e.target);await change(()=>{requireRole('admin');model.products.push({id:uid(),name:String(f.get('name')).trim(),unit:f.get('unit'),retail:num(f.get('retail')),wholesale:num(f.get('wholesale')),minPieces:Math.max(1,Math.trunc(num(f.get('minPieces')))),maxDiscount:num(f.get('maxDiscount'))});queued('produto',model.products.at(-1).id)})}async function editProduct(id){let p=product(id);if(!p)return;let name=prompt('Nome do produto',p.name);if(name===null)return;let retail=prompt('Preço varejo',p.retail),wh=prompt('Preço atacado',p.wholesale),min=prompt('Mínimo peças/un',p.minPieces),discount=prompt('Desconto máximo (%)',p.maxDiscount);if([retail,wh,min,discount].some(x=>x===null))return;await change(()=>{requireRole('admin');if(!name.trim()||num(retail)<0||num(wh)<0||num(min)<1||num(discount)<0||num(discount)>100)throw Error('Valores inválidos');Object.assign(p,{name:name.trim(),retail:num(retail),wholesale:num(wh),minPieces:Math.floor(num(min)),maxDiscount:num(discount)});queued('produto',id)})}
function clientsScreen(){return `<section class="card"><h2>Novo cliente local</h2><form onsubmit="addClient(event)"><label>Nome</label><input name="name" required><div class="grid"><div><label>Tipo</label><select name="type"><option value="PF">Pessoa física</option><option value="PJ">Pessoa jurídica</option></select></div><div><label>CPF ou CNPJ</label><input name="document" inputmode="numeric" required></div><div><label>Telefone</label><input name="phone" type="tel"></div><div><label>Cidade</label><input name="city"></div></div><button class="wide">Cadastrar cliente</button></form></section><section class="card"><h2>Clientes (${model.clients.length})</h2>${model.clients.map(c=>`<div class="item"><b>${esc(c.name)}</b> <span class="muted">${esc(c.type)} · ${esc(c.document)}</span></div>`).join('')}</section>`}function validDoc(v,type){let n=String(v).replace(/\D/g,'');if(n.length!==(type==='PF'?11:14)||/^(\d)\1+$/.test(n))return false;const checksum=(s,weights)=>{const sum=weights.reduce((a,w,i)=>a+Number(s[i])*w,0),r=sum%11;return r<2?0:11-r};if(type==='PF'){let d1=checksum(n.slice(0,9),[10,9,8,7,6,5,4,3,2]),d2=checksum(n.slice(0,10),[11,10,9,8,7,6,5,4,3,2]);return d1===+n[9]&&d2===+n[10]}let d1=checksum(n.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2]),d2=checksum(n.slice(0,13),[6,5,4,3,2,9,8,7,6,5,4,3,2]);return d1===+n[12]&&d2===+n[13]}
async function addClient(e){e.preventDefault();let f=new FormData(e.target),doc=String(f.get('document')).replace(/\D/g,'');if(!validDoc(doc,f.get('type'))){alert('CPF/CNPJ inválido');return}await change(()=>{if(model.clients.some(x=>x.document===doc))throw Error('Documento já cadastrado');let x={id:uid(),name:String(f.get('name')).trim(),type:f.get('type'),document:doc,phone:String(f.get('phone')),city:String(f.get('city'))};model.clients.push(x);queued('cliente',x.id)})}
function loadsScreen(){requireRole('admin','conferente');return `<section class="card"><h2>Nova carga local</h2><form onsubmit="addLoad(event)"><label>Vendedor</label><select name="seller">${model.users.filter(u=>u.role==='vendedor').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><div id="loadLines"></div><button type="button" class="secondary wide" onclick="addLoadLine()">+ Produto na carga</button><button class="wide">Criar carga</button></form></section><section class="card"><h2>Cargas</h2>${model.loads.map(l=>`<div class="item"><b>${esc(l.seller)}</b> · ${esc(l.status)}<div class="muted">${new Date(l.at).toLocaleString('pt-BR')} · ${l.items.length} itens</div><button class="secondary" onclick="showLoad('${l.id}')">Ver saldo</button></div>`).join('')}</section>`}function loadRow(){return `<div class="grid item loadline"><div><label>Produto</label><select class="pid" onchange="this.closest('.loadline').querySelector('.piecesWrap').style.display=product(this.value)?.unit==='kg'?'block':'none'">${model.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Quantidade (kg ou un)</label><input type="number" class="qty" min="0.001" step="0.001" required></div><div class="piecesWrap" style="display:${model.products[0]?.unit==='kg'?'block':'none'}"><label>Peças (queijos)</label><input class="pieces" type="number" min="1" step="1"></div><div><label>Remover</label><button type="button" class="secondary" onclick="this.closest('.loadline').remove()">X</button></div></div>`}function addLoadLine(){if(!model.products.length)return alert('Cadastre ou importe produtos primeiro');$('#loadLines').insertAdjacentHTML('beforeend',loadRow())}async function addLoad(e){e.preventDefault();const f=new FormData(e.target),lines=[...document.querySelectorAll('.loadline')],items=lines.map(x=>{let p=product(x.querySelector('.pid').value),qty=num(x.querySelector('.qty').value),pieces=p.unit==='kg'?num(x.querySelector('.pieces').value):0;if(qty<=0||(p.unit==='kg'&&(!Number.isInteger(pieces)||pieces<1))||(p.unit==='un'&&!Number.isInteger(qty)))throw Error('Confira peças, kg e unidades');return{pid:p.id,qty,pieces}});if(!items.length)return alert('Inclua um produto');if(new Set(items.map(x=>x.pid)).size!==items.length)return alert('Produto duplicado');await change(()=>{let l={id:uid(),seller:f.get('seller'),at:now(),status:'aberta',items};model.loads.push(l);queued('carga',l.id)})}function showLoad(id){let l=activeLoad(id);alert(l.items.map(it=>{let a=available(l,it.pid);return`${product(it.pid)?.name}: ${a.qty} ${product(it.pid)?.unit}, ${a.pieces} peças`}).join('\n'))}
function saleScreen(){return `<section class="card"><h2>Nova venda local</h2>${!model.loads.some(l=>l.status==='aberta')?'<p class="warn">Primeiro crie uma carga aberta no perfil de conferente ou administrador.</p>':''}<form onsubmit="addSale(event)"><label>Carga</label><select name="load" id="saleLoad" onchange="saleRows.innerHTML='';saleLine()">${model.loads.filter(l=>l.status==='aberta'&&(role()==='admin'||l.seller===session)).map(l=>`<option value="${l.id}">${esc(l.seller)} · ${new Date(l.at).toLocaleDateString('pt-BR')}</option>`).join('')}</select><label>Cliente</label><select name="client">${model.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div id="saleRows"></div><button type="button" class="secondary wide" onclick="saleLine()">+ Produto vendido</button><div class="grid"><div><label>Pix (R$)</label><input name="pix" type="number" min="0" step="0.01" value="0"></div><div><label>Dinheiro (R$)</label><input name="cash" type="number" min="0" step="0.01" value="0"></div></div><p class="muted">Saldo restante será registrado como venda a prazo. Verifique valores e forma de pagamento.</p><button class="wide">Salvar venda neste aparelho</button></form></section>`}function saleLine(){let l=activeLoad($('#saleLoad')?.value);if(!l)return alert('Nenhuma carga aberta');let opts=l.items.map(it=>product(it.pid)).filter(Boolean);$('#saleRows').insertAdjacentHTML('beforeend',`<div class="item saleline"><label>Produto</label><select class="pid" onchange="updateSaleLine(this)">${opts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="grid"><div><label>Peso (kg) ou unidades</label><input class="qty" type="number" min="0.001" step="0.001" required></div><div class="piecesWrap"><label>Peças vendidas</label><input class="pieces" type="number" min="1" step="1"></div><div><label>Desconto (%)</label><input class="discount" type="number" min="0" step="0.1" value="0"></div></div><button class="secondary" type="button" onclick="this.closest('.saleline').remove()">Remover</button><div class="muted priceHint"></div></div>`);updateSaleLine($('#saleRows .saleline:last-child .pid'))}function updateSaleLine(el){let row=el.closest('.saleline'),p=product(el.value);row.querySelector('.piecesWrap').style.display=p?.unit==='kg'?'block':'none';row.querySelector('.discount').max=p?.maxDiscount||0;row.querySelector('.priceHint').textContent=`Varejo ${money(p.retail)} | atacado ${money(p.wholesale)} a partir de ${p.minPieces} ${p.unit==='kg'?'peças':'un'} | desconto máximo ${p.maxDiscount}%`}
async function addSale(e){e.preventDefault();let f=new FormData(e.target),l=activeLoad(f.get('load'));if(!l||l.status!=='aberta')return alert('Carga inválida');let client=f.get('client');if(!client)return alert('Cadastre um cliente');let items;try{items=[...document.querySelectorAll('.saleline')].map(el=>{let p=product(el.querySelector('.pid').value),qty=num(el.querySelector('.qty').value),pieces=p.unit==='kg'?num(el.querySelector('.pieces').value):0,discount=num(el.querySelector('.discount').value);if(qty<=0||(p.unit==='kg'&&(!Number.isInteger(pieces)||pieces<1))||(p.unit==='un'&&!Number.isInteger(qty)))throw Error('Quantidade/peças inválidas');if(discount<0||discount>p.maxDiscount)throw Error('Desconto acima do limite de '+p.name);let base=(p.unit==='kg'?pieces:qty)>=p.minPieces?p.wholesale:p.retail;return{pid:p.id,qty,pieces,discount,base,total:round(qty*base*(1-discount/100))}});if(!items.length)throw Error('Adicione produtos');let byId={};items.forEach(it=>{byId[it.pid]??={qty:0,pieces:0};byId[it.pid].qty+=it.qty;byId[it.pid].pieces+=it.pieces});Object.entries(byId).forEach(([pid,v])=>{if(!inStock(l,pid,v.qty,v.pieces))throw Error('Saldo insuficiente: '+product(pid).name)});let total=round(items.reduce((a,x)=>a+x.total,0)),pix=num(f.get('pix')),cash=num(f.get('cash'));if(pix<0||cash<0||pix+cash>total+.001)throw Error('Pagamento maior que o total');await change(()=>{let s={id:uid(),at:now(),loadId:l.id,seller:l.seller,clientId:client,items,total,pix,cash,credit:round(total-pix-cash)};model.sales.push(s);queued('venda',s.id)});screen='venda';render();alert('Venda salva apenas neste aparelho. Exporte o arquivo antes de trocar ou limpar o celular.')}catch(ex){alert(ex.message)}}
function closeScreen(){requireRole('admin','conferente');let ls=model.loads.filter(l=>l.status==='aberta');return `<section class="card"><h2>Conferir fechamento da carga</h2><p class="muted">A conferência compara saldo teórico com retorno contado em peças, kg, unidades e recebimentos.</p><label>Carga aberta</label><select id="closeLoad" onchange="renderCloseDetail()">${ls.map(l=>`<option value="${l.id}">${esc(l.seller)} · ${new Date(l.at).toLocaleDateString('pt-BR')}</option>`).join('')}</select><div id="closeDetail"></div>${ls.length?'<button class="secondary wide" onclick="renderCloseDetail()">Iniciar conferência</button>':'<p>Nenhuma carga aberta.</p>'}</section>`}function renderCloseDetail(){let l=activeLoad($('#closeLoad')?.value);if(!l)return;let sales=model.sales.filter(x=>x.loadId===l.id),cash=round(sales.reduce((a,x)=>a+x.cash,0)),pix=round(sales.reduce((a,x)=>a+x.pix,0));$('#closeDetail').innerHTML=`<form onsubmit="closeLoad(event)"><div id="counted">${l.items.map(it=>{let p=product(it.pid),a=available(l,it.pid);return`<div class="item countRow" data-id="${it.pid}"><b>${esc(p.name)}</b><div class="muted">Esperado: ${a.qty.toFixed(3)} ${p.unit}${p.unit==='kg'?` e ${a.pieces} peças`:''}</div><div class="grid"><div><label>Retorno contado (${p.unit})</label><input class="qty" type="number" step="0.001" min="0" value="${a.qty}" required></div>${p.unit==='kg'?`<div><label>Peças contadas</label><input class="pieces" type="number" step="1" min="0" value="${a.pieces}" required></div>`:''}</div></div>`}).join('')}</div><div class="grid"><div><label>Dinheiro entregue (prev. ${money(cash)})</label><input name="cash" type="number" step="0.01" min="0" value="${cash}" required></div><div><label>Pix confirmado (prev. ${money(pix)})</label><input name="pix" type="number" step="0.01" min="0" value="${pix}" required></div></div><label>Observações / justificativa de divergência</label><textarea name="notes"></textarea><button class="wide">Conferir e fechar</button></form>`}async function closeLoad(e){e.preventDefault();let l=activeLoad($('#closeLoad')?.value);if(!l)return;let f=new FormData(e.target),counts=[...document.querySelectorAll('.countRow')].map(r=>({pid:r.dataset.id,qty:num(r.querySelector('.qty').value),pieces:num(r.querySelector('.pieces')?.value)}));let sales=model.sales.filter(x=>x.loadId===l.id),cash=round(sales.reduce((a,x)=>a+x.cash,0)),pix=round(sales.reduce((a,x)=>a+x.pix,0)),moneyDiff=Math.abs(cash-num(f.get('cash')))>0.01||Math.abs(pix-num(f.get('pix')))>0.01,itemDiff=counts.some(c=>{let a=available(l,c.pid);return Math.abs(a.qty-c.qty)>0.001||a.pieces!==c.pieces}),divergence=moneyDiff||itemDiff,notes=String(f.get('notes')).trim();if(divergence&&role()!=='admin')return alert('Há divergência: somente administrador pode autorizar fechamento.');if(divergence&&!notes)return alert('Justificativa obrigatória para divergência');if(!confirm(divergence?'Confirmar fechamento COM divergência?':'Confirmar fechamento conferido?'))return;await change(()=>{l.status='fechada';let x={id:uid(),loadId:l.id,at:now(),counts,cashExpected:cash,cashCounted:num(f.get('cash')),pixExpected:pix,pixConfirmed:num(f.get('pix')),notes,divergence,by:session};model.settlements.push(x);queued('fechamento',x.id)})}
function dataScreen(){return `<section class="card"><h2>Dados e backup</h2><p class="warn"><b>Atenção:</b> este piloto não importa automaticamente os cadastros da V7 e não envia vendas ao Google Planilhas. Dados permanecem no armazenamento deste navegador e podem desaparecer se você limpar os dados do site ou perder o aparelho.</p><div class="flex"><button onclick="exportJson()">Exportar backup JSON</button><button onclick="exportCsv()" class="secondary">Exportar vendas CSV</button></div><label>Importar backup JSON da própria V8 (substitui os dados locais)</label><input type="file" accept="application/json,.json" onchange="importJson(event)"><h3>Importar produtos da V7 via CSV</h3><p class="muted">Exportar apenas a aba Produtos como CSV no Google Planilhas, então selecionar aqui. Cabeçalhos esperados: nome, unidade, preco, precoAtacado, minAtacado, descontoMax. O sistema faz uma cópia local — não muda sua planilha.</p><input type="file" accept=".csv,text/csv" onchange="importProductsCsv(event)"><p class="muted">Operações locais pendentes: ${model.pending.length}. Não clique em excluir dados do site antes de exportar backup.</p></section>`}function download(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJson(){download('grotadas-v8-backup-'+Date.now()+'.json',new Blob([JSON.stringify(model,null,2)],{type:'application/json'}))}function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCsv(){const rows=[['id','dataHora','vendedor','cliente','total','pix','dinheiro','prazo','itens'],...model.sales.map(x=>[x.id,x.at,x.seller,model.clients.find(c=>c.id===x.clientId)?.name,x.total,x.pix,x.cash,x.credit,x.items.map(i=>`${product(i.pid)?.name}: ${i.pieces} peças, ${i.qty} ${product(i.pid)?.unit}`).join(' | ')])];download('vendas-v8-'+Date.now()+'.csv',new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}))}async function importJson(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==8||!Array.isArray(data.products)||!Array.isArray(data.sales))throw Error('Arquivo não é um backup V8 válido');if(!confirm('Substituir todos os dados deste aparelho pelos do backup?'))return;model=data;await persist();render()}catch(ex){alert(ex.message)}}function parseCsv(s){let rows=[],row=[],cur='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(!quoted&&(c===';'||c===',')){row.push(cur);cur=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cur);if(row.some(x=>x.trim()))rows.push(row);row=[];cur=''}else cur+=c}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}async function importProductsCsv(e){let file=e.target.files[0];if(!file)return;try{let rows=parseCsv((await file.text()).replace(/^\ufeff/,'')),headers=rows.shift().map(x=>x.trim().toLowerCase()),col=x=>headers.indexOf(x.toLowerCase());if(col('nome')<0)throw Error('Coluna nome não encontrada');const ps=rows.filter(r=>r[col('nome')]).map(r=>({id:uid(),name:r[col('nome')],unit:String(r[col('unidade')]||'un').toLowerCase().includes('kg')?'kg':'un',retail:num(r[col('preco')]),wholesale:num(r[col('precoatacado')]||r[col('preco')]),minPieces:Math.max(1,Math.floor(num(r[col('minatacado')])||1)),maxDiscount:num(r[col('descontomax')])}));if(!confirm('Importar '+ps.length+' produtos locais?'))return;await change(()=>{for(let p of ps){if(model.products.some(x=>x.name===p.name))continue;model.products.push(p)}queued('importacao','produtos')})}catch(ex){alert('Não foi possível importar: '+ex.message)}}
(async()=>{try{db=await openDb();model=await loadDb();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){$('#status').textContent='Falha no armazenamento local: '+e.message;$('#app').innerHTML='<p>Use Chrome atualizado e HTTPS.</p>'}})();
</script></body></html>
